name: Release review
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/seo/verify-release-review.mjs
        env:
          TRTRX_RELEASE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: node scripts/analytics/verify-public-cta.mjs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
